name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --requirement requirements-docs.txt
      - run: mkdocs build --strict --site-dir /tmp/gameplan-docs
      - run: docker build --tag gameplan:test .
