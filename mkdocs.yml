# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: GamePlan
site_description: Self-hosted, Discord-first planning for flexible Steam game nights.

theme:
  name: material
  language: en
  logo: assets/gameplan-hero.png
  favicon: assets/gameplan-hero.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Use dark mode
  features:
    - navigation.footer
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Documentation: index.md
  - Get started:
      - Quick start: quickstart.md
      - Discord bot setup: discord-setup.md
  - Run GamePlan:
      - Flexible Game Nights: flexible-game-nights-operations.md
      - Rolling deployments: rolling-deployments.md
      - Operations: operations.md
  - Reference:
      - Security and data: security-and-data.md
      - Database migrations: migrations.md
  - Project:
      - Public release audit: public-release-audit.md
      - Architecture decisions:
          - Discord bot and browser identity: adr/0001-discord-bot-browser-identity.md
          - Session host transfer: adr/0002-session-host-transfer.md
          - Database-backed notifications: adr/0003-database-backed-notifications.md
